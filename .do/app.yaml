# DigitalOcean App Platform spec — London (lon).
# Import this file or create the app from GitHub and match these commands.
# Do not put real secrets here. Set SECRET env vars in the App Platform UI.

name: savills-cloud-portal
region: lon

services:
  - name: web
    github:
      repo: tomsharp-bot/Savills-cloud-portal
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    # typescript / @types live in dependencies so this works with NODE_ENV=production
    # (npm ci omits devDependencies when NODE_ENV is production at build time).
    build_command: npm ci && npx prisma generate && npm run build
    # Wrapper mutates DATABASE_URL then execs migrate in the same env.
    # Do not use `node scripts/ensure-database-url.js && …` — the healed value would be lost.
    run_command: node scripts/ensure-database-url.js npx prisma migrate deploy && npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    # HHSRS site form accepts up to 4 photos × 40MB (≈162MB multipart).
    # App Platform does not expose a client_max_body_size knob; file uploads
    # time out after 600s. Body-size checks live in Express/multer.
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: BASE_PATH
        value: /projectprogress
        scope: RUN_TIME
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: SESSION_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: SPACES_BUCKET
        value: cloud-portal-vault
        scope: RUN_TIME
      - key: SPACES_REGION
        value: lon1
        scope: RUN_TIME
      - key: SPACES_ENDPOINT
        value: https://lon1.digitaloceanspaces.com
        scope: RUN_TIME
      - key: REQUIRE_SPACES
        value: "true"
        scope: RUN_TIME
      - key: SPACES_KEY
        type: SECRET
        scope: RUN_TIME
      - key: SPACES_SECRET
        type: SECRET
        scope: RUN_TIME
      # Ideal Postcodes key for HHSRS Find address. Set the value in the App Platform UI.
      # Declared here so the name is part of the spec; do not paste the key into this file.
      - key: IDEAL_POSTCODES_API_KEY
        type: SECRET
        scope: RUN_TIME
      # Morning Photos Pool import (/api/projects/:project/photos/ingest).
      # Set the value in the App Platform UI. If it is unset the endpoint returns 503.
      - key: PHOTO_INGEST_KEY
        type: SECRET
        scope: RUN_TIME
