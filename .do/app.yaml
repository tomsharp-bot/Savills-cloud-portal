# DigitalOcean App Platform spec — London (lon).
# Import this file or create the app from GitHub and match these commands.
# Do not put real secrets here. Set SECRET env vars in the App Platform UI.

name: savills-cloud-portal
region: lon

services:
  - name: web
    github:
      repo: tomsharp-bot/Savills-cloud-portal
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    # typescript / @types live in dependencies so this works with NODE_ENV=production
    # (npm ci omits devDependencies when NODE_ENV is production at build time).
    build_command: npm ci && npx prisma generate && npm run build
    run_command: npx prisma migrate deploy && npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: SESSION_SECRET
        type: SECRET
        scope: RUN_TIME
      - key: SPACES_BUCKET
        value: cloud-portal-vault
        scope: RUN_TIME
      - key: SPACES_REGION
        value: lon1
        scope: RUN_TIME
      - key: SPACES_ENDPOINT
        value: ""
        scope: RUN_TIME
      - key: SPACES_KEY
        type: SECRET
        scope: RUN_TIME
      - key: SPACES_SECRET
        type: SECRET
        scope: RUN_TIME
