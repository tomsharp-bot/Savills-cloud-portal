services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: savills_cloud_portal
    ports:
      - "5432:5432"
    volumes:
      - portal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d savills_cloud_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portal_pg:
